<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025全廠區 ASE 水平衡圖(互動填數版)</title>
<style>
  :root {
    --panel-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #eef0f3;
    color: #222;
  }
  #app {
    display: flex;
    height: 100vh;
  }
  #canvas-area {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #f5f6f8;
    background-image:
      linear-gradient(45deg, #eaeaea 25%, transparent 25%),
      linear-gradient(-45deg, #eaeaea 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eaeaea 75%),
      linear-gradient(-45deg, transparent 75%, #eaeaea 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }
  #viewport {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    cursor: grab;
  }
  #viewport.dragging { cursor: grabbing; }
  #viewport svg {
    display: block;
    width: 841.68px;
    height: 595.2px;
    background: white;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .ph-input {
    width: 100%; height: 100%;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    font-size: 5.4px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    text-align: center;
    color: #111;
  }
  .ph-input:focus {
    outline: 1.2px solid #2962ff;
    outline-offset: -1px;
    z-index: 5;
  }
  .ph-input.filled {
    font-weight: 600;
  }

  /* toolbar */
  #toolbar {
    position: absolute;
    top: 12px; left: 12px;
    display: flex;
    gap: 6px;
    z-index: 20;
    background: rgba(255,255,255,0.95);
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.15);
  }
  #toolbar button {
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #toolbar button:hover { background: #f0f0f0; }

  #legend {
    position: absolute;
    bottom: 12px; left: 12px;
    z-index: 20;
    background: rgba(255,255,255,0.95);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .swatch { width: 14px; height: 14px; display:inline-block; border:1px solid #999; vertical-align:middle; margin-right:4px; border-radius:2px;}

  /* side panel */
  #panel {
    width: var(--panel-w);
    background: #fff;
    border-left: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #panel h2 {
    font-size: 15px;
    margin: 0;
    padding: 14px 16px;
    border-bottom: 1px solid #eee;
    background: #fafafa;
  }
  .panel-section {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    overflow-y: auto;
  }
  .panel-section.grow { flex: 1; }
  .panel-section h3 {
    font-size: 13px;
    margin: 0 0 8px 0;
    color: #555;
  }
  #panel input[type=text], #panel textarea {
    width: 100%;
    font-size: 12px;
    padding: 5px 7px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-bottom: 6px;
  }
  #panel button.action {
    background: #2962ff;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  #panel button.action.secondary {
    background: #eee;
    color: #333;
  }
  #panel button.action:hover { opacity: 0.85; }

  .check-row {
    border: 1px solid #e2e2e2;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
    background: #fafbfc;
  }
  .check-row .result {
    font-size: 12px;
    margin-top: 4px;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .result.ok { background: #e3f6e5; color: #1b7a24; }
  .result.bad { background: #fdecec; color: #c62828; }
  .result.pending { background: #f1f1f1; color: #888; }
  .check-row .del-btn {
    float: right;
    font-size: 11px;
    color: #999;
    cursor: pointer;
    border: none;
    background: none;
  }

  #idTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  #idTable th, #idTable td {
    border-bottom: 1px solid #eee;
    padding: 3px 4px;
    text-align: left;
  }
  #idTable input[type=text] {
    margin: 0;
    padding: 2px 4px;
  }
  #idFilter { margin-bottom: 6px; }

  .hint {
    font-size: 11px;
    color: #888;
    line-height: 1.5;
  }

  @media print {
    #toolbar, #legend, #panel { display: none !important; }
    #canvas-area { position: static; overflow: visible; background: none; }
    #viewport { position: static !important; transform: none !important; }
    #app { display: block; height: auto; }
    body { background: #fff; }
  }
</style>
</head>

color": "pink"}, {"id": "ph73", "label": "總二次利用廢水回收(R1/u6)", "color": "white"}, {"id": "ph74", "label": "(d5-3/d8)", "color": "pink"}, {"id": "ph75", "label": "量(I/D-1)", "color": "white"}, {"id": "ph76", "label": "量(I/D-1)", "color": "white"}];

// ---------- Pan & Zoom ----------
const canvasArea = document.getElementById('canvas-area');
const viewport = document.getElementById('viewport');
let scale = 1, tx = 60, ty = 40;
let isPanning = false, startX, startY;

function applyTransform() {
  viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}
applyTransform();

canvasArea.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvasArea.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const prevScale = scale;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(6, Math.max(0.2, scale * delta));
  // zoom around mouse position
  tx = mx - (mx - tx) * (scale / prevScale);
  ty = my - (my - ty) * (scale / prevScale);
  applyTransform();
}, { passive: false });

viewport.addEventListener('mousedown', (e) => {
  if (e.target.closest('input')) return; // don't pan when clicking an input
  isPanning = true;
  viewport.classList.add('dragging');
  startX = e.clientX - tx;
  startY = e.clientY - ty;
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  tx = e.clientX - startX;
  ty = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isPanning = false;
  viewport.classList.remove('dragging');
});

document.getElementById('zoomInBtn').onclick = () => { scale = Math.min(6, scale*1.2); applyTransform(); };
document.getElementById('zoomOutBtn').onclick = () => { scale = Math.max(0.2, scale/1.2); applyTransform(); };
document.getElementById('zoomResetBtn').onclick = () => { scale = 1; tx = 60; ty = 40; applyTransform(); };

document.getElementById('printBtn').onclick = () => window.print();

// ---------- Export / Import values ----------
document.getElementById('exportBtn').onclick = () => {
  const data = {};
  PH_META.forEach(m => {
    const el = document.getElementById(m.id);
    if (el) data[m.id] = el.value;
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '水平衡圖_數值_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};

document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.value = data[id];
          el.classList.toggle('filled', data[id] !== '' && data[id] !== undefined);
        }
      });
      recalcAll();
    } catch (err) {
      alert('匯入失敗，檔案格式不正確');
    }
  };
  reader.readAsText(file);
});

// ---------- input styling on change ----------
PH_META.forEach(m => {
  const el = document.getElementById(m.id);
  if (!el) return;
  el.addEventListener('input', () => {
    el.classList.toggle('filled', el.value !== '');
    recalcAll();
  });
});

// ---------- ID reference table ----------
const tbody = document.querySelector('#idTable tbody');
document.getElementById('phCount').textContent = PH_META.length;
function renderTable(filter) {
  tbody.innerHTML = '';
  const f = (filter || '').toLowerCase();
  PH_META.forEach(m => {
    const label = m.label || '';
    if (f && !(m.id.toLowerCase().includes(f) || label.toLowerCase().includes(f))) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><code>${m.id}</code></td><td>${label}</td><td>${m.color}</td>`;
    tr.style.cursor = 'pointer';
    tr.title = '點擊定位到圖上此欄位';
    tr.onclick = () => focusField(m.id);
    tbody.appendChild(tr);
  });
}
renderTable('');
document.getElementById('idFilter').addEventListener('input', (e) => renderTable(e.target.value));

function focusField(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.focus();
  el.scrollIntoView({ block: 'center', inline: 'center' });
}

// ---------- Balance check builder ----------
const checkList = document.getElementById('checkList');
let checkCounter = 0;
const checks = [];

function addCheckRow(name, left, right) {
  const rowId = 'chk' + (++checkCounter);
  checks.push({ rowId, name: name || ('檢查式 ' + checkCounter), left: left || '', right: right || '' });
  renderChecks();
}

function renderChecks() {
  checkList.innerHTML = '';
  checks.forEach(c => {
    const div = document.createElement('div');
    div.className = 'check-row';
    div.innerHTML = `
      <button class="del-btn" data-id="${c.rowId}">✕ 刪除</button>
      <input type="text" class="chk-name" data-id="${c.rowId}" value="${c.name}" placeholder="名稱">
      <input type="text" class="chk-left" data-id="${c.rowId}" value="${c.left}" placeholder="左式，例如 ph3+ph5">
      <input type="text" class="chk-right" data-id="${c.rowId}" value="${c.right}" placeholder="右式，例如 ph8">
      <div class="result pending" id="result-${c.rowId}">尚未計算</div>
    `;
    checkList.appendChild(div);
  });

  checkList.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const idx = checks.findIndex(c => c.rowId === id);
      if (idx >= 0) checks.splice(idx, 1);
      renderChecks();
    };
  });
  checkList.querySelectorAll('.chk-name, .chk-left, .chk-right').forEach(inp => {
    inp.addEventListener('input', () => {
      const id = inp.dataset.id;
      const c = checks.find(c => c.rowId === id);
      if (!c) return;
      if (inp.classList.contains('chk-name')) c.name = inp.value;
      if (inp.classList.contains('chk-left')) c.left = inp.value;
      if (inp.classList.contains('chk-right')) c.right = inp.value;
      recalcAll();
    });
  });
  recalcAll();
}

document.getElementById('addCheckBtn').onclick = () => addCheckRow('', '', '');

function safeEval(expr) {
  // only allow known ph ids, numbers, + - * / ( ) . and whitespace
  if (!expr || !expr.trim()) return null;
  const cleaned = expr.replace(/ph\d+/g, (m) => {
    const el = document.getElementById(m);
    const v = el ? parseFloat(el.value) : NaN;
    return isNaN(v) ? '0' : '(' + v + ')';
  });
  if (!/^[0-9+\-*/().\s]*$/.test(cleaned)) return NaN;
  try {
    // eslint-disable-next-line no-new-func
    return Function('"use strict"; return (' + cleaned + ')')();
  } catch (e) {
    return NaN;
  }
}

function recalcAll() {
  checks.forEach(c => {
    const resEl = document.getElementById('result-' + c.rowId);
    if (!resEl) return;
    if (!c.left.trim() && !c.right.trim()) {
      resEl.className = 'result pending';
      resEl.textContent = '尚未計算';
      return;
    }
    const l = safeEval(c.left);
    const r = safeEval(c.right);
    if (l === null || r === null || isNaN(l) || isNaN(r)) {
      resEl.className = 'result pending';
      resEl.textContent = '算式尚未完整或格式錯誤';
      return;
    }
    const diff = l - r;
    if (Math.abs(diff) < 0.01) {
      resEl.className = 'result ok';
      resEl.textContent = `✓ 平衡  左=${l}　右=${r}`;
    } else {
      resEl.className = 'result bad';
      resEl.textContent = `✕ 不平衡  左=${l}　右=${r}　差=${diff.toFixed(2)}`;
    }
  });
}
